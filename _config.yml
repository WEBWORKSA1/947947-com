# 947947.com — Jekyll configuration (built natively by GitHub Pages, free plan)
title: "947947"
tagline: "Every number, decoded"
description: "Look up any number: maths facts, numerology, angel-number folklore, Chinese, Japanese and Korean readings, phone codes and more. Free tools and personal number readings."
url: "https://947947.com"      # production domain (used for canonical links, sitemap, social cards)
baseurl: ""                    # leave empty: every internal link is relative, so the site also works on github.io
lang: en

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Number pages: one tiny stub per number in _numbers/ (generated by scripts/make-stubs.mjs).
collections:
  numbers:
    output: true
    permalink: /:name/

defaults:
  - scope: { path: "", type: numbers }
    values: { layout: number }
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "numbers" }
    values: { section: numbers, parent_title: "Numbers", parent_url: "numbers/", sticky_cta: "Is one of these your number?" }
  - scope: { path: "tools" }
    values: { section: tools, layout: tool, tools_js: true }
  - scope: { path: "guides" }
    values: { section: guides, layout: guide }

exclude:
  - README.md
  - docs/
  - scripts/
  - package.json
  - LICENSE
  - "*.mjs"
  - vendor/
  - Gemfile
  - Gemfile.lock

include:
  - .well-known

sass:
  style: compressed
