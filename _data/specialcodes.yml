# Short phone codes with a well-known purpose. Shown on matching number pages.
"0": ["The operator in the classic North American dial plan"]
"100": ["Police in India (being merged into 112)"]
"101": ["UK police non-emergency line", "Fire service in India"]
"102": ["Ambulance in India"]
"108": ["Emergency ambulance service in many Indian states"]
"110": ["Police in Japan, mainland China, Taiwan and Germany"]
"111": ["Emergency number in New Zealand", "NHS non-urgent medical help line in England, Scotland and Wales"]
"112": ["Emergency number across the European Union, India and many other countries; works from most mobile phones"]
"119": ["Fire and ambulance in Japan, South Korea and Taiwan; fire service in mainland China"]
"120": ["Ambulance in mainland China"]
"211": ["Community and social services information line in much of the US and Canada"]
"311": ["Non-emergency city services line in many US and Canadian cities"]
"411": ["Directory assistance in the US and Canada"]
"511": ["Traffic and travel information in many US states and Canadian provinces"]
"611": ["Mobile carrier customer service in the US"]
"711": ["Telecommunications relay service for people with hearing or speech disabilities (US)"]
"811": ["Call before you dig in the US; non-urgent health advice line in several Canadian provinces"]
"911": ["Emergency number in the US, Canada and several other countries"]
"988": ["Suicide and Crisis Lifeline in the US (since 2022) and Canada (since 2023) — call or text 988"]
"999": ["Emergency number in the UK, Ireland, Hong Kong, Malaysia and other countries"]
"995": ["Fire and ambulance in Singapore"]
"800": ["US and Canadian toll-free area code (1-800)"]
"833": ["US and Canadian toll-free area code"]
"844": ["US and Canadian toll-free area code"]
"855": ["US and Canadian toll-free area code"]
"866": ["US and Canadian toll-free area code"]
"877": ["US and Canadian toll-free area code"]
"888": ["US and Canadian toll-free area code"]
"900": ["Premium-rate (pay-per-call) prefix in North America"]
