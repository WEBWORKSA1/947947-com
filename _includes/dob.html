<fieldset class="dob"><legend class="field-legend">{{ include.legend | default: "Birth date" }}</legend>
  <label><span>Day</span><select name="day{{ include.sfx }}" aria-label="Day"{% if include.required %} required{% endif %}><option value="">Day</option>{% for i in (1..31) %}<option>{{ i }}</option>{% endfor %}</select></label>
  <label><span>Month</span><select name="month{{ include.sfx }}" aria-label="Month"{% if include.required %} required{% endif %}><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></label>
  <label><span>Year</span><select name="year{{ include.sfx }}" aria-label="Year" data-years{% if include.required %} required{% endif %}></select></label>
</fieldset>
